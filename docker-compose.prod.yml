services:
  # Backend Django
  web:
    build: .
    command: >
      sh -c "sleep 10 &&
             PGPASSWORD=postgres psql -h db -U postgres -c 'CREATE DATABASE steamrf;' 2>/dev/null || true &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn steamrf.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=steamrf
      - DB_USER=postgres
      - DB_PASS=postgres
      - DEBUG=0

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - web

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=steamrf
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
