services:
  web:
    build: .
    command: >
      sh -c "sleep 10 &&
             PGPASSWORD=postgres psql -h db -U postgres -c 'CREATE DATABASE steamrf;' 2>/dev/null || true &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=steamrf
      - DB_USER=postgres
      - DB_PASS=postgres
      - DEBUG=1

  test:
    build: .
    command: pytest -xvs
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=test_steamrf
      - DB_USER=postgres
      - DB_PASS=postgres
      - DJANGO_SETTINGS_MODULE=steamrf.settings
      - PYTEST_ADDOPTS="--cov=. --cov-report=term"

  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=steamrf
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@steamrf.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
